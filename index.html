<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Bankito — Evaluador de ubicaciones</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:700}header span{font-size:12px;color:#94a3b8}
.wrap{display:flex;height:calc(100vh - 52px)}@media(max-width:820px){.wrap{flex-direction:column;height:auto}}
#map{flex:1;min-height:340px}
aside{width:390px;max-width:100%;background:#fff;overflow-y:auto;border-left:1px solid #e2e8f0;padding:18px}
.bar{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
button{padding:10px 16px;background:#0f172a;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.hint{font-size:12px;color:#64748b;margin-bottom:14px}
.grade{display:flex;align-items:baseline;gap:10px;padding:16px;border-radius:12px;color:#fff;margin-bottom:14px}
.grade b{font-size:44px;line-height:1}.grade i{font-style:normal;font-size:18px;font-weight:600;opacity:.95}
.grade small{display:block;font-size:12px;opacity:.9;margin-top:4px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.chip{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:9px 11px}
.chip u{display:block;font-size:9px;letter-spacing:.6px;color:#94a3b8;text-decoration:none;font-weight:700}
.chip b{font-size:15px}
.blk{border-radius:10px;padding:12px 14px;margin-bottom:10px}
.blk h3{font-size:11px;letter-spacing:.7px;margin-bottom:7px}
.blk li{font-size:13px;margin-left:16px;margin-bottom:3px;color:#334155}
.ok{background:#f0fdf4;border-left:4px solid #16a34a}.ok h3{color:#16a34a}
.bad{background:#fef2f2;border-left:4px solid #dc2626}.bad h3{color:#dc2626}
.res{background:#f1f5f9;border-radius:8px;padding:12px;font-size:13px;color:#334155}
.load{text-align:center;color:#64748b;padding:30px 0}
</style></head><body>
<header><h1>🏦 Mi Bankito</h1><span>Evaluador de ubicaciones · sucursal 10 m² · bancos + prestamistas + remesas</span></header>
<div class="wrap">
  <div id="map"></div>
  <aside>
    <div class="bar">
      <input id="q" placeholder="12.1508, -86.2504" />
      <button id="go">Evaluar</button>
    </div>
    <p class="hint">Pegá coordenadas o hacé clic en el mapa. Criterios de kiosco: gente circulando, zona sin bancos, transporte y clientela de préstamos.</p>
    <div id="out"></div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const URL_FN="https://buuxljsdonkxxtbdnwpm.supabase.co/functions/v1/scan-bankito";
const KEY="sb_publishable_Ue9dGEu3yoRD0cbIzzg69A_gnrIgxSd";
const COL={"A+":"#0f5c2c","A":"#15803d","B":"#a16207","C":"#c2410c","D":"#b91c1c","F":"#7f1d1d"};
const map=L.map('map').setView([12.136,-86.251],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let mk=null;
map.on('click',e=>evaluar(e.latlng.lat,e.latlng.lng));
document.getElementById('go').onclick=()=>{
  const m=document.getElementById('q').value.match(/(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)/);
  if(m) evaluar(parseFloat(m[1]),parseFloat(m[2])); else alert('Formato: 12.1508, -86.2504');
};
async function evaluar(lat,lng){
  const out=document.getElementById('out');
  out.innerHTML='<div class="load">Evaluando…</div>';
  document.getElementById('go').disabled=true;
  if(mk) map.removeLayer(mk);
  mk=L.marker([lat,lng]).addTo(map); map.setView([lat,lng],15);
  try{
    const r=await fetch(URL_FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({lat,lng})});
    const d=await r.json();
    if(d.error){out.innerHTML='<div class="res">Error: '+d.error+'</div>';return;}
    const c=d.conteos,x=d.detalle;
    out.innerHTML=
      '<div class="grade" style="background:'+(COL[d.grade]||'#475569')+'"><b>'+d.grade+'</b><i>'+d.score+'/10'+
        '<small>'+lat.toFixed(4)+', '+lng.toFixed(4)+'</small></i></div>'+
      '<div class="chips">'+
        chip('BANCOS/ATM CERCA',c.bancos_atm+(c.bancos_atm<=2?' (desatendida)':''))+
        chip('COMERCIOS',c.comercios)+chip('TRANSPORTE',c.transporte)+
        chip('FINANCIERAS',c.financieras)+chip('PUNTOS REMESA',c.puntos_remesa)+
        chip('CONCURRENCIA',x.concurrencia+'/10')+
      '</div>'+
      blk('ok','● QUÉ SUMA',d.suma)+blk('bad','● QUÉ RESTA',d.resta)+
      '<div class="res"><b>Resumen:</b> '+d.resumen+'</div>';
  }catch(e){out.innerHTML='<div class="res">No se pudo evaluar: '+e.message+'</div>';}
  document.getElementById('go').disabled=false;
}
const chip=(t,v)=>'<div class="chip"><u>'+t+'</u><b>'+v+'</b></div>';
const blk=(cl,t,it)=>(!it||!it.length)?'':'<div class="blk '+cl+'"><h3>'+t+'</h3><ul>'+it.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>';
</script></body></html>
